name: Build, push e bump submodule tv3ws em TV30

on:
  push:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV3WS (self)
        uses: actions/checkout@v4
        with:
          path: tv3ws

      - name: Checkout Infra (Dockerfile + contextos extras)
        uses: actions/checkout@v4
        with:
          repository: multisens/Infra
          token: ${{ secrets.TV30_REPO_TOKEN }}
          path: infra

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push tv30-tv3ws
        uses: docker/build-push-action@v5
        with:
          context: ./tv3ws
          file: ./infra/dockerfiles/tv3ws.Dockerfile
          build-contexts: |
            tv30-data=./infra/user-files-template
            tv30-scripts=./infra/dockerfiles
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tv30-tv3ws:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tv30-tv3ws:latest

  bump:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV30 (super-projeto)
        uses: actions/checkout@v4
        with:
          repository: multisens/TV30
          token: ${{ secrets.TV30_REPO_TOKEN }}
          submodules: false
          fetch-depth: 0

      - name: Atualizar ponteiro do submodule tv3ws
        env:
          TV3WS_SHA: ${{ github.sha }}
        run: |
          set -e
          git config user.name  "Luis Claudio Ribeiro Junior"
          git config user.email "luis.claudio.r.jr@gmail.com"

          CURRENT=$(git ls-tree HEAD tv3ws | awk '{print $3}')
          if [ "$CURRENT" = "$TV3WS_SHA" ]; then
            echo "Ponteiro ja em $TV3WS_SHA — sem mudancas"
            exit 0
          fi

          echo "Atualizando ponteiro do submodule tv3ws: $CURRENT -> $TV3WS_SHA"
          git update-index --cacheinfo 160000 "$TV3WS_SHA" tv3ws

          git commit -m "chore: bump submodule tv3ws pra ${TV3WS_SHA:0:7}"

          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Push falhou apos 3 tentativas"
          exit 1
