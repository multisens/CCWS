name: Build, push e bump submodule ccws em TV30

on:
  push:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CCWS (self)
        uses: actions/checkout@v4
        with:
          path: ccws

      - name: Checkout Infra (Dockerfile + contextos extras)
        uses: actions/checkout@v4
        with:
          repository: multisens/Infra
          token: ${{ secrets.TV30_REPO_TOKEN }}
          path: infra

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push tv30-ws-subset
        uses: docker/build-push-action@v5
        with:
          context: ./ccws
          file: ./infra/dockerfiles/ccws.Dockerfile
          build-contexts: |
            tv30-data=./infra/user-files-template
            tv30-scripts=./infra/dockerfiles
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tv30-ws-subset:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tv30-ws-subset:latest

  bump:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV30 (super-projeto)
        uses: actions/checkout@v4
        with:
          repository: multisens/TV30
          token: ${{ secrets.TV30_REPO_TOKEN }}
          submodules: false
          fetch-depth: 0

      - name: Atualizar ponteiro do submodule ccws
        env:
          CCWS_SHA: ${{ github.sha }}
        run: |
          set -e
          git config user.name  "Luis Claudio Ribeiro Junior"
          git config user.email "luis.claudio.r.jr@gmail.com"

          CURRENT=$(git ls-tree HEAD ccws | awk '{print $3}')
          if [ "$CURRENT" = "$CCWS_SHA" ]; then
            echo "Ponteiro ja em $CCWS_SHA — sem mudancas"
            exit 0
          fi

          echo "Atualizando ponteiro do submodule ccws: $CURRENT -> $CCWS_SHA"
          git update-index --cacheinfo 160000 "$CCWS_SHA" ccws

          git commit -m "chore: bump submodule ccws pra ${CCWS_SHA:0:7}"

          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Push falhou apos 3 tentativas"
          exit 1
